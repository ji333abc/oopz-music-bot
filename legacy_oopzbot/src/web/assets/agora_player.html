<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Agora Player</title></head>
<body>
<script>
// 在 Agora SDK 加载前拦截 WebSocket，捕获 Agora 的 WS 连接
const _wsInstances = [];
const _OrigWS = window.WebSocket;
window.WebSocket = function(url, protocols) {
  const ws = protocols ? new _OrigWS(url, protocols) : new _OrigWS(url);
  _wsInstances.push(ws);
  return ws;
};
window.WebSocket.prototype = _OrigWS.prototype;
window.WebSocket.CONNECTING = _OrigWS.CONNECTING;
window.WebSocket.OPEN = _OrigWS.OPEN;
window.WebSocket.CLOSING = _OrigWS.CLOSING;
window.WebSocket.CLOSED = _OrigWS.CLOSED;
</script>
<script src="agora_sdk.js"></script>
<script>
let client = null;
let audioTrack = null;
let _playback = null;
let _state = "idle";
let _playGen = 0;
let currentAgoraUid = null;
let currentOopzUid = null;
let currentMicMuted = false;
let currentSpeakerMuted = false;
// 跨 audioTrack 持久化的音量（0-100）。每次创建新 track 后会自动应用，
// 避免每首歌切换后用户都得重新拖一次音量条。
let _currentVolume = 30;

window.agoraReady = () => typeof AgoraRTC !== "undefined";

window.agoraJoin = async (appId, token, channelName, uid) => {
  try {
    if (client) await window.agoraLeave();
    client = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
    if (typeof client.setClientRole === "function") {
      await client.setClientRole("host");
    }
    const assignedUid = await client.join(appId, channelName, token, uid || null);
    currentAgoraUid = Number(assignedUid || uid);
    _state = "joined";
    return { ok: true, uid: assignedUid };
  } catch (e) {
    return { ok: false, error: e.message };
  }
};

function getAgoraSignalWs() {
  const edgeWs = _wsInstances.find(w =>
    w.readyState === 1 &&
    typeof w.url === "string" &&
    w.url.includes("edge.sd-rtn.com")
  );
  return edgeWs || _wsInstances.find(w => w.readyState === 1) || null;
}

async function waitForAgoraSignalWs(timeoutMs = 3000) {
  const start = performance.now();
  while (performance.now() - start < timeoutMs) {
    const ws = getAgoraSignalWs();
    if (ws) return ws;
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  return null;
}

function shortId() {
  return Math.random().toString(36).slice(2, 10);
}

async function sendCurrentVoiceState(repeat = 2) {
  const ws = await waitForAgoraSignalWs(3000);
  if (!ws) return { ok: false, error: "no open agora ws" };
  if (!currentOopzUid || currentAgoraUid === null || currentAgoraUid === undefined) {
    return { ok: false, error: "voice identity is not ready" };
  }
  try {
    const statePayload = {
      m: currentMicMuted ? 1 : 0,
      uid: String(currentOopzUid),
      cid: Number(currentAgoraUid),
      hm: currentSpeakerMuted ? 1 : 0,
    };
    const payload = btoa(JSON.stringify(statePayload));
    const sendTs = Math.floor(performance.now());
    for (let i = 0; i < repeat; i++) {
      ws.send(JSON.stringify({
        _id: shortId(),
        _type: "data_stream",
        _message: { payload, syncWithAudio: false, sendTs: sendTs + i * 2 }
      }));
    }
    return { ok: true, payload: statePayload, ws: ws.url };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

window.agoraSetVoiceIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  currentOopzUid = oopzUid || currentOopzUid;
  if (agoraUid !== undefined && agoraUid !== null) {
    currentAgoraUid = Number(agoraUid);
  }
  return await sendCurrentVoiceState(2);
};

window.agoraSetVoiceState = async (micMuted, speakerMuted = currentSpeakerMuted) => {
  currentMicMuted = !!micMuted;
  currentSpeakerMuted = !!speakerMuted;
  return await sendCurrentVoiceState(2);
};

// Each playback owns its media resources, including pending URL loads.
async function releasePlayback(p) {
  if (!p) return;
  if (p.cancel) p.cancel();
  if (p.element) {
    p.element.onended = p.element.onerror = null;
    p.element.pause();
    p.element.removeAttribute("src");
    p.element.load();
  }
  if (p.source) p.source.disconnect();
  if (p.track) {
    try { if (client) await client.unpublish([p.track]); } catch (_) {}
    try { p.track.close(); } catch (_) {}
  }
  if (p.context) { try { await p.context.close(); } catch (_) {} }
}

window.agoraPlayAudio = async (url) => {
  const gen = ++_playGen;
  const previous = _playback;
  _playback = null;
  audioTrack = null;
  await releasePlayback(previous);
  if (gen !== _playGen) return { ok: false, error: "superseded" };
  const p = {};
  _playback = p;
  try {
    if (/^https?:\/\//i.test(url)) {
      // HTMLMediaElement streams progressively instead of decoding the entire
      // song before playback, as createBufferSourceAudioTrack does for a URL.
      const element = p.element = new Audio();
      element.crossOrigin = "anonymous";
      element.preload = "none";
      p.context = new AudioContext();
      p.source = p.context.createMediaElementSource(element);
      const destination = p.context.createMediaStreamDestination();
      p.source.connect(destination);
      p.track = AgoraRTC.createCustomAudioTrack({
        mediaStreamTrack: destination.stream.getAudioTracks()[0],
        encoderConfig: "high_quality_stereo",
      });
      p.track.setVolume(_currentVolume);
      await p.context.resume();
      if (gen !== _playGen) throw new Error("superseded");
      await client.publish([p.track]);
      if (gen !== _playGen) throw new Error("superseded");
      await new Promise((resolve, reject) => {
        const finish = (error) => {
          clearTimeout(timer);
          element.removeEventListener("playing", playing);
          element.removeEventListener("error", failed);
          p.cancel = null;
          error ? reject(error) : resolve();
        };
        const playing = () => finish();
        const failed = () => finish(new Error("remote audio load failed"));
        const timer = setTimeout(() => finish(new Error("remote audio start timeout")), 20000);
        p.cancel = () => finish(new Error("superseded"));
        element.addEventListener("playing", playing);
        element.addEventListener("error", failed);
        element.src = url;
        element.play().catch(finish);
      });
      element.onended = () => { if (gen === _playGen) _state = "finished"; };
      element.onerror = () => { if (gen === _playGen) _state = "error"; };
    } else {
      p.track = await AgoraRTC.createBufferSourceAudioTrack({
        source: url, cacheOnlineFile: false, encoderConfig: "high_quality_stereo",
      });
      if (gen !== _playGen) throw new Error("superseded");
      p.track.setVolume(_currentVolume);
      p.track.on("source-state-change", (st) => {
        if (gen === _playGen) _state = st === "stopped" ? "finished" : st;
      });
      await client.publish([p.track]);
      if (gen !== _playGen) throw new Error("superseded");
      p.track.startProcessAudioBuffer({ loop: false });
    }
    if (gen !== _playGen) throw new Error("superseded");
    audioTrack = p.track;
    _state = "playing";
    await sendCurrentVoiceState(2);
    if (gen !== _playGen) throw new Error("superseded");
    const duration = p.element ? p.element.duration : p.track.duration;
    return { ok: true, duration: Number.isFinite(duration) ? duration : 0, agoraUid: currentAgoraUid };
  } catch (e) {
    await releasePlayback(p);
    if (gen === _playGen) {
      _playback = null;
      audioTrack = null;
      _state = "joined";
    }
    return { ok: false, error: e.message };
  }
};

window.agoraPlayLocal = async (base64Data, mimeType) => {
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const objectUrl = URL.createObjectURL(new Blob([bytes], { type: mimeType || "audio/mpeg" }));
  try {
    return await window.agoraPlayAudio(objectUrl);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }
};

window.agoraSendIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  return await window.agoraSetVoiceIdentity(oopzUid, agoraUid);
};

window.agoraVoiceDebug = () => ({
  state: _state,
  currentOopzUid,
  currentAgoraUid,
  currentMicMuted,
  currentSpeakerMuted,
  ws: _wsInstances.map(w => ({ url: w.url, readyState: w.readyState })),
});

window.agoraPause = () => {
  if (!audioTrack || _state !== "playing") return { ok: false, error: "not playing" };
  try {
    if (_playback?.element) _playback.element.pause();
    else audioTrack.pauseProcessAudioBuffer();
    _state = "paused";
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
};

window.agoraResume = async () => {
  if (!audioTrack || _state !== "paused") return { ok: false, error: "not paused" };
  try {
    if (_playback?.element) await _playback.element.play();
    else audioTrack.resumeProcessAudioBuffer();
    _state = "playing";
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
};

window.agoraSeek = (time) => {
  if (!audioTrack) return { ok: false, error: "no track" };
  try {
    if (_playback?.element) _playback.element.currentTime = time;
    else audioTrack.seekAudioBuffer(time);
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
};

window.agoraSetVolume = (vol) => {
  const v = Math.max(0, Math.min(100, Number(vol) || 0));
  _currentVolume = v;
  if (!audioTrack) return { ok: true, pending: true, volume: v };
  try {
    audioTrack.setVolume(v);
    return { ok: true, volume: v };
  } catch (e) { return { ok: false, error: e.message }; }
};

window.agoraGetCurrentTime = () => {
  if (!audioTrack) return 0;
  try { return _playback?.element ? _playback.element.currentTime : audioTrack.getCurrentTime(); } catch (_) { return 0; }
};

window.agoraStopAudio = async () => {
  ++_playGen;
  const previous = _playback;
  _playback = null;
  audioTrack = null;
  _state = "joined";
  await releasePlayback(previous);
};

window.agoraLeave = async () => {
  await window.agoraStopAudio();
  if (client) {
    try { await client.leave(); } catch (_) {}
    client = null;
  }
  _state = "idle";
};

window.agoraState = () => _state;
</script>
</body>
</html>
