name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m compileall -q -f oopzbot
      - run: python -m unittest discover -s tests -v
      - run: ruff check oopzbot tests
      - run: python -m build

  panel:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  uploader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/qqbot-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/qqbot-uploader/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker images and Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare fake Compose environment
        shell: bash
        run: |
          set -euo pipefail
          ci_env="$RUNNER_TEMP/oopzbot-ci.env"
          python -c 'from pathlib import Path; Path(r"'$RUNNER_TEMP'/oopzbot-ci.env").write_text("QQBOT_APP_ID=ci-placeholder\nQQBOT_APP_SECRET=ci-placeholder\nQQBOT_BRIDGE_TOKEN=ci-placeholder-token\nOOPZ_PANEL_PASSWORD=ci-placeholder-password\nOOPZ_AGORA_APP_ID=ci-placeholder\nQQBOT_OOPZ_AREA_ID=ci-area\nQQBOT_OOPZ_TEXT_CHANNEL_ID=ci-text\nQQBOT_OOPZ_VOICE_CHANNEL_ID=ci-voice\n", encoding="utf-8")'
          cp "$ci_env" .env
          trap 'rm -f .env "$ci_env"' EXIT
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python -c 'import json, pathlib; c=json.loads(pathlib.Path(r"'$RUNNER_TEMP'/compose.json").read_text()); s=c["services"]; ports=[str(p) for name in s for p in (s[name].get("ports") or [])]; assert not any(any(f":{port}:" in p or p.endswith(f":{port}") for p in ports) for port in ("6379", "3200", "18080")); assert any("127.0.0.1" in p and ":3000:" in p for p in ports); assert any("127.0.0.1" in p and ":18081:" in p for p in ports)'
          docker compose build bot qqmusic panel
