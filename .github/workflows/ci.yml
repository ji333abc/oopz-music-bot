name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m compileall -q -f oopzbot
      - run: python -m unittest discover -s tests -v
      - run: ruff check oopzbot tests
      - run: python -m build

  uploader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/qqbot-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/qqbot-uploader/package-lock.json
      - run: npm ci
      - run: npm test
