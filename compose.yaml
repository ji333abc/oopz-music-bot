services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    init: true

  qqmusic:
    build:
      context: .
      dockerfile: Dockerfile.qqmusic
    restart: unless-stopped
    environment:
      QQ_MUSIC_COOKIE: ${QQ_MUSIC_COOKIE:-}
      QQ_MUSIC_API_CONFIG_DIR: /opt/qqmusic-config
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3200/explorer/metadata',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    init: true

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OOPZ_VOICE_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      QQ_MUSIC_MANAGED: "false"
      QQ_MUSIC_BASE_URL: http://qqmusic:3200
      OOPZBOT_BRIDGE_HOST: 0.0.0.0
      OOPZBOT_BRIDGE_PRIVATE_NETWORK: "true"
      OOPZBOT_PANEL_STATE_FILE: /app/data/panel-state.json
      QQBOT_JM_UPLOADER: /app/tools/qqbot-uploader/uploader.mjs
      QQBOT_JM_TEMP_ROOT: /app/data/jm-tasks
      QQBOT_JM_TIMING_PATH: /app/data/jm_timing.json
      OOPZBOT_USE_LEGACY_CORE: "true"
      OOPZ_LEGACY_DATA_DIR: /app/data/legacy
      OOPZ_LEGACY_SOURCE_ROOT: /app/legacy_oopzbot
      BOT_REDIS_HOST: redis
      BOT_REDIS_PORT: "6379"
      BOT_REDIS_PASSWORD: ""
      BOT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      BOT_CHROMEDRIVER_PATH: /usr/bin/chromedriver
      # These secrets belong only to the panel container.  Keep the broad
      # compatibility env_file for legacy options, but explicitly remove them
      # from the bot process.
      OOPZ_PANEL_PASSWORD: ""
      RACKNERD_API_KEY: ""
      RACKNERD_API_HASH: ""
    depends_on:
      qqmusic:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "${OOPZ_LEGACY_WEB_BIND:-127.0.0.1}:${OOPZ_LEGACY_WEB_PORT:-18081}:18081"
    healthcheck:
      test:
        - CMD
        - gosu
        - oopzbot
        - python
        - -c
        - "import os,urllib.request; port=os.getenv('OOPZBOT_BRIDGE_PORT','18080'); urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz',timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    init: true
    stop_grace_period: 30s

  panel:
    build:
      context: ./panel
    restart: unless-stopped
    environment:
      OOPZBOT_BRIDGE_URL: http://bot:18080/internal/qqbot/command
      OOPZBOT_PANEL_SNAPSHOT_URL: http://bot:18080/internal/panel/snapshot
      QQBOT_BRIDGE_TOKEN: ${QQBOT_BRIDGE_TOKEN:?QQBOT_BRIDGE_TOKEN is required}
      OOPZ_PANEL_PUBLIC_URL: ${OOPZ_PANEL_PUBLIC_URL:-http://localhost:3000}
      OOPZ_PANEL_USERNAME: ${OOPZ_PANEL_USERNAME:-admin}
      OOPZ_PANEL_PASSWORD: ${OOPZ_PANEL_PASSWORD:?OOPZ_PANEL_PASSWORD is required}
      RACKNERD_API_KEY: ${RACKNERD_API_KEY:-}
      RACKNERD_API_HASH: ${RACKNERD_API_HASH:-}
    depends_on:
      bot:
        condition: service_healthy
    ports:
      - "${OOPZ_PANEL_BIND:-127.0.0.1}:${OOPZ_PANEL_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    stop_grace_period: 15s

volumes:
  redis-data:
